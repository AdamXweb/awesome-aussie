name: Addition
description: Suggest a new entry to be added to the list
title: '[ADDITION] <provider name>'
labels: ['Addition', 'Awaiting Review']
assignees:
  - AdamXweb
body:
  - type: markdown
    attributes:
      value: |-
        ## Thanks for suggesting an addition 🇦🇺
        The fields below feed straight into our vetting pipeline in Baserow.
        Filling them out completely lets us review your submission much faster
        (no back-and-forth chasing details).

  - type: input
    id: provider
    attributes:
      label: Provider / Project name
      description: The exact name to display in the README.
      placeholder: e.g. Atlassian
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website URL
      description: The canonical website (we use this for the README link).
      placeholder: https://example.com.au
    validations:
      required: true

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn company URL
      description: >-
        Used to verify HQ, headcount, and that this is a real company.
        Paste the LinkedIn /company/ URL.
      placeholder: https://www.linkedin.com/company/example
    validations:
      required: true

  - type: input
    id: abn
    attributes:
      label: Australian Business Number (ABN)
      description: >-
        11-digit ABN. We verify it via the
        [ABR lookup](https://abr.business.gov.au) to confirm the entity is
        registered in Australia. If you can't find an ABN, put `unknown`
        and explain why in the description below.
      placeholder: '12 345 678 901'
    validations:
      required: true

  - type: input
    id: hq
    attributes:
      label: Head office (city, state)
      description: Primary HQ location, in the format "City, STATE".
      placeholder: Sydney, NSW
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      description: >-
        Choose one from the
        [existing categories](https://github.com/AdamXweb/awesome-aussie#categories),
        or propose a new one.
      placeholder: e.g. Design Tools
    validations:
      required: true

  - type: input
    id: alternative-to
    attributes:
      label: Alternative to
      description: >-
        Comma-separated list of overseas/non-Aussie equivalents this provider
        replaces. Helps readers find the right tool quickly.
      placeholder: Figma, Sketch
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: One-line description
      description: A short, neutral description (max ~140 characters).
      placeholder: Cloud-based design platform for non-designers.
    validations:
      required: true

  - type: input
    id: extended-reason
    attributes:
      label: Reason for the Extended list (optional)
      description: >-
        If you think this belongs in EXTENDED.md rather than (or as well as)
        the main README, give the reason here. Leave blank for main-list-only.
      placeholder: Niche but high-quality alternative for X.
    validations:
      required: false

  - type: textarea
    id: supporting-material
    attributes:
      label: Supporting links (optional)
      description: >-
        Any extra material that helps us verify - GitHub repo, Crunchbase
        page, news coverage, AppStore link, etc.
      placeholder: |
        - https://github.com/example/repo
        - https://www.crunchbase.com/organization/example
    validations:
      required: false

  - type: input
    id: association
    attributes:
      label: Association disclosure
      description: >-
        Are you affiliated with this project? (Founder, employee, investor,
        contractor, none, etc.) For transparency only - we still accept good
        submissions from people who built the thing.
      placeholder: 'Founder / Employee / None'
    validations:
      required: true

  - type: dropdown
    id: canImplement
    attributes:
      label: Would you like to submit a PR?
      description: Optional - lets us prioritise reviewer attention.
      options:
        - 'No.'
        - 'Maybe?'
        - 'Yes!'
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Final confirmations
      options:
        - label: I've filled this out accurately and to the best of my knowledge.
          required: true
        - label: I've disclosed any association with this provider.
          required: true
        - label: >-
            I've checked that no
            [open issue](https://github.com/AdamXweb/awesome-aussie/issues?q=is%3Aissue)
            already covers this provider.
          required: true
        - label: >-
            I agree to the
            [code of conduct](https://github.com/AdamXweb/awesome-aussie/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true

  - type: markdown
    attributes:
      value: |-
        ## What happens next
        Submissions move through this pipeline in Baserow:
        **Backlog → In Vetting → Ready to Publish → Published.**
        You should expect a first response within 48 hours. The README and
        EXTENDED list rebuild daily, so once your entry is marked
        *Published* it'll appear within 24 hours.
