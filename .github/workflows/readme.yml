name: Rebuild awesome aussie README.md

on:
  push:
    branches: "main"
  workflow_dispatch:
  schedule:
    # Daily at midnight UTC
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Baserow schema
        run: pnpm run check-schema
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_API_BASE_URL: ${{ secrets.BASEROW_API_BASE_URL }}
          BASEROW_PROVIDERS_TABLE_ID: ${{ secrets.BASEROW_PROVIDERS_TABLE_ID }}
          BASEROW_CATEGORIES_TABLE_ID: ${{ secrets.BASEROW_CATEGORIES_TABLE_ID }}
          BASEROW_README_BLOCKS_TABLE_ID: ${{ secrets.BASEROW_README_BLOCKS_TABLE_ID }}

      - name: Build README from Baserow
        run: pnpm run readme
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_API_BASE_URL: ${{ secrets.BASEROW_API_BASE_URL }}
          BASEROW_PROVIDERS_TABLE_ID: ${{ secrets.BASEROW_PROVIDERS_TABLE_ID }}
          BASEROW_CATEGORIES_TABLE_ID: ${{ secrets.BASEROW_CATEGORIES_TABLE_ID }}
          BASEROW_README_BLOCKS_TABLE_ID: ${{ secrets.BASEROW_README_BLOCKS_TABLE_ID }}
          README_STATUSES: Active - Awesome List

      - name: Build EXTENDED list from Baserow
        run: pnpm run extended
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_API_BASE_URL: ${{ secrets.BASEROW_API_BASE_URL }}
          BASEROW_PROVIDERS_TABLE_ID: ${{ secrets.BASEROW_PROVIDERS_TABLE_ID }}
          BASEROW_CATEGORIES_TABLE_ID: ${{ secrets.BASEROW_CATEGORIES_TABLE_ID }}
          BASEROW_README_BLOCKS_TABLE_ID: ${{ secrets.BASEROW_README_BLOCKS_TABLE_ID }}
          EXTENDED_STATUSES: Active - Extended List

      - name: Stage rebuilt files
        run: |
          rm -rf node_modules
          git config user.name "AdamXbot"
          git config user.email 'adamxbot@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          msg="rebuilding readme from baserow for $(date)"
          git commit -m "$msg"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: baserow-updates/patch
          delete-branch: true
          title: '[BUILD] Daily update readme from Baserow workflow'
          base: main
          author: AdamXbot <adamxbot@users.noreply.github.com>
          reviewers: AdamXweb
