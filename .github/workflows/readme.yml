# Rebuilds README.md and EXTENDED.md from Airtable and opens a PR with the result

name: Rebuild awesome aussie README.md

on:
  push:
    branches: "main"
  workflow_dispatch: # Manual dispatch
  schedule:
    # Daily at midnight utc
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # create-pull-request pushes the update branch and opens the PR
      contents: write
      pull-requests: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # create-pull-request authenticates with its own token input;
          # don't leave credentials in the checkout.
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build README from Airtable
        run: pnpm run readme
        env:
          AIRTABLE_API_KEY: ${{secrets.AIRTABLE_API_KEY}}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - name: Build EXTENDED list from Airtable
        run: pnpm run extended
        env:
          AIRTABLE_API_KEY: ${{secrets.AIRTABLE_API_KEY}}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}

      # Remove unwanted items
      - name: Removing installed dependencies and committing changes
        run: |
          rm -rf node_modules
          git config user.name "AdamXbot"
          git config user.email 'adamxbot@users.noreply.github.com'
          git add .
          msg="rebuilding readme from airtable for $(date)"
          git commit -m "$msg"
      # Create pull request of changes to main branch
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: airtable-updates/patch
          delete-branch: true
          title: '[BUILD] Daily update readme from Airtable workflow'
          base: main
          author: AdamXbot <adamxbot@users.noreply.github.com>
          reviewers: AdamXweb
