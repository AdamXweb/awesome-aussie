name: Weekly link check

on:
  workflow_dispatch:
  schedule:
    # Mondays at 02:00 UTC (~12pm Sydney during AEST). Off-peak so we don't
    # get rate-limited by the small sites we link to.
    - cron: "0 2 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Baserow provider table
        run: pnpm run check-schema
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_API_BASE_URL: ${{ secrets.BASEROW_API_BASE_URL }}
          BASEROW_PROVIDERS_TABLE_ID: ${{ secrets.BASEROW_PROVIDERS_TABLE_ID }}

      - name: Walk Baserow providers and verify each URL
        run: pnpm run check-links -- --report=link-check-report.json
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_API_BASE_URL: ${{ secrets.BASEROW_API_BASE_URL }}
          BASEROW_PROVIDERS_TABLE_ID: ${{ secrets.BASEROW_PROVIDERS_TABLE_ID }}
          LINK_CHECK_CONCURRENCY: "8"
          LINK_CHECK_TIMEOUT_MS: "15000"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json
          retention-days: 30

      - name: Open / update tracker issue with stale URLs
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('link-check-report.json')) return;
            const r = JSON.parse(fs.readFileSync('link-check-report.json', 'utf8'));
            if (!r.staleProviders || r.staleProviders.length === 0) {
              core.info('No stale URLs - nothing to report.');
              return;
            }
            const title = 'Weekly link-check: stale URLs detected';
            const lines = r.staleProviders.map(i =>
              `- **${i.name}** — ${i.url || '(no url)'} — \`${i.status || i.error || 'error'}\``
            ).join('\n');
            const body = `Last checked: ${r.checkedAt}\n\n` +
              `Found ${r.staleProviders.length} stale URL(s) of ${r.total} checked.\n\n${lines}\n\n` +
              `These have been marked with \`Stale URL = true\` in Baserow. Triage and either fix the URL or set the provider Status to \`Dead Link\`.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check',
            });
            if (existing.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              core.info(`Updated existing tracker issue #${existing[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-check'],
              });
              core.info('Created new tracker issue.');
            }
