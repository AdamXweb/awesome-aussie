name: Sync main to Website
on:
  workflow_run:
    workflows: ["Rebuild awesome aussie README.md"]
    branches: ['main', 'airtable']
    types:
      - completed

permissions:
  contents: read

jobs:
  sync-branches:
    # Only sync the website when the rebuild actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Syncing branches
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          # persist-credentials stays at the default (true): the push below
          # authenticates with the checkout's GITHUB_TOKEN.
      - name: Push main to gh-pages
        # gh-pages mirrors main for awesome-aussie.com. --force is required
        # because gh-pages carries commits that main does not have.
        run: git push --force origin main:gh-pages
