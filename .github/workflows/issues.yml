name: Add Issues to Airtable from Github

on:
  workflow_dispatch: # Manual dispatch
  schedule:
    # Hourly
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  syncissues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # This job never pushes; don't leave credentials in the checkout.
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Syncing Issues from Github to Airtable
        run: pnpm run issues
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID_ISSUES: ${{ secrets.AIRTABLE_TABLE_ID_ISSUES }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
      - name: Add Issues To GitHub projects
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
